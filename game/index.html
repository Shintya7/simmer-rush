<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simmer Rush — a three-minute dinner rush</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2b1a10; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* The canvas keeps its own 1280x800 stage; the browser scales it to fit. */
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
  <!-- No favicon file: the empty data-URI icon stops the browser asking for one. -->
  <link rel="icon" href="data:,">
</head>
<body>
<canvas id="game" width="1280" height="800" aria-label="Simmer Rush: run a tiny kitchen, chop and cook ingredients, plate dishes and serve them before the order tickets run out"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
